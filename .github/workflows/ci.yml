name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Linting & Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy bandit
      - name: Check Formatting with Black
        run: black --check backend/
      - name: Lint Code with Ruff
        run: ruff check backend/
      - name: Type Check with MyPy
        run: mypy backend/ --ignore-missing-imports
      - name: Security Scan with Bandit
        run: bandit -r backend/ -x backend/tests/ -ll

  pytest-and-coverage:
    name: Pytest Suite & Coverage Gate (>= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run Pytest Suite with Coverage
        env:
          PYTHONPATH: backend
        run: |
          pytest --cov=backend --cov-fail-under=90 --cov-report=term-missing backend/tests/

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Container
        run: |
          docker build -t flawnetic-backend:latest ./backend
